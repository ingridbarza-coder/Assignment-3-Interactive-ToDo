<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>
        <p class="subtitle">one thing at a time.</p>

        <div class="tabs">
            <button class="tab active" data-category="uni">Uni</button>
            <button class="tab" data-category="social">Social</button>
            <button class="tab" data-category="personal">Personal</button>
            <button class="tab" data-category="completed">Completed</button>
        </div>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task"
            >
            <button type="submit">Add Task</button>
        </form>

        <p id="message"></p>

        <h2 id="category-title">Uni</h2>

        <ul id="task-list"></ul>

        <p id="task-count"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
